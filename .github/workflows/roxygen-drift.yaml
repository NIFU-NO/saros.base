# Fails when the checked-in `man/` and `NAMESPACE` are not what roxygen2
# produces from the current roxygen comments in `R/`.
#
# Motivated by GH #219: `delete_freeze()` was tagged `@export` and had a
# generated `man/delete_freeze.Rd`, but `NAMESPACE` had never been
# regenerated, so `saros.base::delete_freeze()` failed with "not an exported
# object". `R CMD check` does not catch this -- an export missing from
# NAMESPACE is a valid package, just one missing a function -- and pkgdown
# indexes `.Rd` topics rather than exports, so it stayed green too.
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

name: roxygen-drift.yaml

permissions: read-all

jobs:
  roxygen-drift:
    runs-on: ubuntu-latest

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          # roxygen2 is pinned to the version DESCRIPTION records, so the job
          # asks a reproducible question -- "are man/ and NAMESPACE what THIS
          # roxygen2 produces?" -- rather than a moving one. Tracking the
          # latest release instead makes the job unfixable for a maintainer on
          # an older roxygen2: 8.1.0 reflows multiple importFrom() entries from
          # one package into a multi-line call, so it disagrees with 8.0.0 on a
          # NAMESPACE neither version is wrong about.
          #
          # Keep this in sync with DESCRIPTION; the next step fails loudly if
          # it drifts. roxygenise() also loads the package source with pkgload,
          # so every package in Imports has to be present -- hence local::.
          extra-packages: roxygen2@8.0.0, local::.
          needs: check

      - name: Check the pin still matches DESCRIPTION
        run: |
          desc <- read.dcf("DESCRIPTION")
          # roxygen2 stamps its version as RoxygenNote up to 7.x and as
          # Config/roxygen2/version from 8.0.0.
          field <- intersect(c("Config/roxygen2/version", "RoxygenNote"), colnames(desc))
          if (!length(field)) stop("DESCRIPTION records no roxygen2 version.")
          recorded <- unname(desc[, field[1]])
          installed <- as.character(packageVersion("roxygen2"))
          if (!identical(recorded, installed)) {
            stop(sprintf(paste0(
              "DESCRIPTION records roxygen2 %s but this workflow installs %s.\n",
              "Update extra-packages in .github/workflows/roxygen-drift.yaml to roxygen2@%s."),
              recorded, installed, recorded))
          }
          cat("roxygen2", installed, "matches DESCRIPTION.\n")
        shell: Rscript {0}

      - name: Regenerate documentation
        run: roxygen2::roxygenise()
        shell: Rscript {0}

      - name: Fail if man/ or NAMESPACE changed
        run: |
          # DESCRIPTION is deliberately excluded. roxygen2 stamps its own
          # version into it -- as `RoxygenNote` up to 7.x, as
          # `Config/roxygen2/version` from 8.0.0 -- which tracks the toolchain
          # rather than the sources, so it churns on every roxygen2 release.
          if ! git diff --quiet -- man NAMESPACE; then
            echo "::error::man/ and/or NAMESPACE are out of sync with the roxygen comments in R/."
            echo
            echo "Run roxygen2::roxygenise() (or devtools::document()) locally and commit the result."
            echo "Use the roxygen2 version DESCRIPTION records -- the step above checked that this"
            echo "job is running that same version, so a local run will reproduce the diff below."
            echo
            git --no-pager diff -- man NAMESPACE
            exit 1
          fi
          echo "man/ and NAMESPACE are in sync."
        shell: bash
